name: Offline review only
on:
  workflow_dispatch:
  push:
    branches: [main]
  # Enable a schedule only after consent, durable state design, and a successful
  # live end-to-end test. Public GitHub scheduling is not a punctuality guarantee.
  # schedule:
  #   - cron: '17 */3 * * *'
permissions: {}
concurrency:
  group: claimvsevidence-offline-review
  cancel-in-progress: false
jobs:
  dry-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # No Actions dependencies or unverified action SHAs. Built-in git reads the
      # public repository at the exact workflow commit; no auth or credentials.
      - name: Read public source at exact commit
        env:
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          GIT_TERMINAL_PROMPT: '0'
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git init .
          git -c credential.helper= fetch --depth=1 "https://github.com/${SOURCE_REPO}.git" "$SOURCE_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Mocked tests and offline queue validation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -v
          python3 publisher.py queue.json
          python3 pilot.py --config campaign.json --queue queue.json
